# به‌روزرسانی خودکار وابستگی‌ها — نسخه‌ها در catalog (pnpm-workspace.yaml) متمرکزند،
# بنابراین یک PR می‌تواند همه‌ی بخش‌ها را هم‌زمان هم‌نسخه نگه دارد.
version: 2
updates:
  - package-ecosystem: "pnpm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "02:00"
      timezone: "Asia/Tehran"
    open-pull-requests-limit: 5
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/apps/web"
      - "/apps/ocr"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "build(docker)"

  - package-ecosystem: "pip"
    directory: "/apps/ocr"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "build(ocr)"
