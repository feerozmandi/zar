version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: xennic_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xennic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xennic_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-xennic_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - xennic_network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: xennic_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - xennic_network

  # NestJS Core API Gateway
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: xennic_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-xennic_user}:${POSTGRES_PASSWORD:-xennic_secure_pass}@postgres:5432/${POSTGRES_DB:-xennic_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-secret_jwt_key_xennic_prod_32chars}
      BYOK_ENCRYPTION_KEY: ${BYOK_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
    networks:
      - xennic_network

  # Next.js Frontend Web & Workspaces
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    container_name: xennic_web
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - xennic_network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: xennic_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    networks:
      - xennic_network

networks:
  xennic_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
