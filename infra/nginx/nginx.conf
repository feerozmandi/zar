user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 12m; # کمی بزرگ‌تر از سقف آپلود ۱۰MB در API

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;

  gzip on;
  gzip_vary on;
  gzip_types text/css text/plain application/json application/javascript image/svg+xml;

  # محدودساز نرخ در لبه (لایه‌ی دوم؛ لایه‌ی اول ThrottlerGuard در Nest است)
  limit_req_zone $binary_remote_addr zone=xennic_api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=xennic_html:10m rate=10r/s;

  include /etc/nginx/conf.d/*.conf;
}
