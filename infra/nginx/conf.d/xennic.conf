# مسیرهای فایل آپلودی و خروجی PDF با حجم بیشتر مجاز هستند
upstream xennic_web { server xennic-web:3000; keepalive 32; }
upstream xennic_api { server xennic-api:4000; keepalive 32; }

server {
  listen 80;
  server_name ${PUBLIC_HOST};

  include /etc/nginx/snippets/security-headers.conf;

  # هسته‌ی API (شامل آپلود قبض)
  location /api/ {
    limit_req zone=xennic_api burst=40 nodelay;
    proxy_pass http://xennic_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 12m;
    proxy_read_timeout 120s;
  }

  # فایل‌های استاتیک Next (کش بلندمدت)
  location /_next/static/ {
    proxy_pass http://xennic_web;
    proxy_cache_valid 200 30d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # باقی مسیرها به فرانت‌اند
  location / {
    limit_req zone=xennic_html burst=30 nodelay;
    proxy_pass http://xennic_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
