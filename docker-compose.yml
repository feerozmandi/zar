# ══════════════════════════════════════════════════════════════════════════════
# زیرساخت کانتینری Xennic (نوت ۵ §۱) — Nginx + Next.js + NestJS + OCR + PostgreSQL + Redis
# اجرای توسعه:  pnpm infra:up     (این فایل + docker-compose.dev.yml)
# اجرای تولید:  docker compose up -d --build
# ══════════════════════════════════════════════════════════════════════════════
name: xennic

services:
  xennic-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xennic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xennic}
      POSTGRES_DB: ${POSTGRES_DB:-xennic}
      # شمارۀ اعداد در گزارش‌های SQL پایدار بماند
      TZ: UTC
    volumes:
      - xennic-pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xennic} -d ${POSTGRES_DB:-xennic}"]
      interval: 10s
      timeout: 5s
      retries: 8

  xennic-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - xennic-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  xennic-ocr:
    build:
      context: .
      dockerfile: apps/ocr/Dockerfile
    restart: unless-stopped
    environment:
      OCR_LANGUAGES: ${OCR_LANGUAGES:-fas+eng}
      REDIS_URL: redis://xennic-redis:6379
    volumes:
      - xennic-uploads:/srv/uploads
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  xennic-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["node", "apps/api/dist/main.js"]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      API_GLOBAL_PREFIX: /api
      CORS_ORIGINS: ${XENNIC_SITE_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-xennic}:${POSTGRES_PASSWORD:-xennic}@xennic-postgres:5432/${POSTGRES_DB:-xennic}?schema=public
      REDIS_URL: redis://xennic-redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET باید در .env تنظیم شود}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY باید در .env تنظیم شود}
      OCR_SERVICE_URL: http://xennic-ocr:8000
      GITHUB_MODELS_TOKEN: ${GITHUB_MODELS_TOKEN:-}
      UPLOAD_DIR: /var/lib/xennic/uploads
      TRUST_PROXY: "true"
      SWAGGER_ENABLED: "false"
    volumes:
      - xennic-uploads:/var/lib/xennic/uploads
    healthcheck:
      # probe بی‌نیاز از دیتابیس؛ worker تا سالم شدن API شروع نمی‌شود
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      xennic-postgres:
        condition: service_healthy
      xennic-redis:
        condition: service_healthy
      xennic-ocr:
        condition: service_started

  xennic-worker:
    # پردازشگر صف‌ها (OCR، تحلیل AI، صدور PDF) — در ظرف جدا تا بار از API اصلی گرفته شود
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    command: ["node", "apps/api/dist/infra/queue/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-xennic}:${POSTGRES_PASSWORD:-xennic}@xennic-postgres:5432/${POSTGRES_DB:-xennic}?schema=public
      REDIS_URL: redis://xennic-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      OCR_SERVICE_URL: http://xennic-ocr:8000
      GITHUB_MODELS_TOKEN: ${GITHUB_MODELS_TOKEN:-}
      BULLMQ_CONCURRENCY: ${BULLMQ_CONCURRENCY:-4}
    depends_on:
      xennic-api:
        condition: service_started

  xennic-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/proxy
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://xennic-api:4000/api/v1
      NEXT_PUBLIC_API_URL: /api/proxy
      NEXT_PUBLIC_SITE_URL: ${XENNIC_SITE_URL:-http://localhost:3000}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      xennic-api:
        condition: service_healthy

  xennic-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      xennic-web:
        condition: service_healthy
      xennic-api:
        condition: service_healthy

volumes:
  xennic-pgdata:
  xennic-redisdata:
  xennic-uploads:
